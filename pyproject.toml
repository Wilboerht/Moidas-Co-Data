[project]
name = "codata"
version = "0.1.0"
description = "DataFlow/Rnote 多服务商小红书关键词达人采集客户端与 React 面板"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
codata = "codata.cli:main"
codata-panel = "codata.api_server:main"
codata-web = "codata.api_server:main"
codata-admin = "codata.admin_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codata"]
